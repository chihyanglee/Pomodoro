<!doctype html>
<html lang="en" data-theme="clean">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Timer</title>
  <meta name="description" content="A simple focus timer with three themes, three timer styles and a fullscreen countdown.">
  <meta name="theme-color" content="#F7F7F8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='13' fill='%23CE2C31'/%3E%3Cpath d='M16 4c1 2 3 3 5 3-2 1-4 1-5 0-1 1-3 1-5 0 2 0 4-1 5-3z' fill='%2330A46C'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Only drawn in the "Falling Colors" theme -->
  <canvas id="falling" aria-hidden="true"></canvas>
  <!-- Only shown in the "Grayscale" theme: drifting light blobs -->
  <div class="fx" aria-hidden="true"></div>

  <!-- ============ 1. SETUP ============ -->
  <main id="setup" class="setup">
    <form id="setup-form" class="card" novalidate>
      <header class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Pomodoro</h1>
          <p class="lede">Set it up, then focus in fullscreen.</p>
        </div>
      </header>

      <fieldset class="group">
        <legend>Duration</legend>
        <div class="durations">
          <div class="field">
            <label for="focus-min">Focus</label>
            <div class="input-wrap">
              <input id="focus-min" name="focus" type="number" inputmode="numeric" min="1" max="180" step="1" value="25" required aria-describedby="duration-error">
              <span class="unit" aria-hidden="true">min</span>
            </div>
            <div class="chips" data-for="focus-min" aria-label="Focus presets">
              <button type="button" class="chip" data-value="15">15</button>
              <button type="button" class="chip" data-value="25">25</button>
              <button type="button" class="chip" data-value="50">50</button>
            </div>
          </div>
          <div class="field">
            <label for="break-min">Break</label>
            <div class="input-wrap">
              <input id="break-min" name="break" type="number" inputmode="numeric" min="1" max="60" step="1" value="5" required aria-describedby="duration-error">
              <span class="unit" aria-hidden="true">min</span>
            </div>
            <div class="chips" data-for="break-min" aria-label="Break presets">
              <button type="button" class="chip" data-value="5">5</button>
              <button type="button" class="chip" data-value="10">10</button>
              <button type="button" class="chip" data-value="15">15</button>
            </div>
          </div>
        </div>
        <p class="error" id="duration-error" hidden></p>
      </fieldset>

      <fieldset class="group">
        <legend>Color theme</legend>
        <div class="options options-4">
          <label class="option">
            <input type="radio" name="theme" value="clean" checked>
            <span class="option-body">
              <span class="preview swatch" data-theme="clean" aria-hidden="true">25:00</span>
              <span class="option-text">
                <span class="option-title">Clean</span>
                <span class="option-sub">Minimalist SaaS</span>
              </span>
            </span>
          </label>
          <label class="option">
            <input type="radio" name="theme" value="linear">
            <span class="option-body">
              <span class="preview swatch" data-theme="linear" aria-hidden="true">25:00</span>
              <span class="option-text">
                <span class="option-title">Midnight</span>
                <span class="option-sub">Linear-style dark</span>
              </span>
            </span>
          </label>
          <label class="option">
            <input type="radio" name="theme" value="falling">
            <span class="option-body">
              <span class="preview swatch" data-theme="falling" aria-hidden="true">25:00</span>
              <span class="option-text">
                <span class="option-title">Falling Colors</span>
                <span class="option-sub">Playful &amp; vivid</span>
              </span>
            </span>
          </label>
          <label class="option">
            <input type="radio" name="theme" value="grayscale">
            <span class="option-body">
              <span class="preview swatch" data-theme="grayscale" aria-hidden="true">25:00</span>
              <span class="option-text">
                <span class="option-title">Grayscale</span>
                <span class="option-sub">Animated mono</span>
              </span>
            </span>
          </label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Timer style</legend>
        <div class="options">
          <label class="option">
            <input type="radio" name="style" value="digital" checked>
            <span class="option-body">
              <span class="preview" aria-hidden="true">
                <svg viewBox="0 0 64 40"><text x="32" y="25.5" text-anchor="middle" class="pv-text">25:00</text></svg>
              </span>
              <span class="option-text">
                <span class="option-title">Digital</span>
                <span class="option-sub">Just the numbers</span>
              </span>
            </span>
          </label>
          <label class="option">
            <input type="radio" name="style" value="ring">
            <span class="option-body">
              <span class="preview" aria-hidden="true">
                <svg viewBox="0 0 64 40">
                  <circle cx="32" cy="20" r="14" class="pv-track"/>
                  <circle cx="32" cy="20" r="14" class="pv-arc" pathLength="100" stroke-dasharray="70 100" transform="rotate(-90 32 20)"/>
                  <text x="32" y="22.5" text-anchor="middle" class="pv-text pv-text-sm">25</text>
                </svg>
              </span>
              <span class="option-text">
                <span class="option-title">Ring</span>
                <span class="option-sub">Circular progress</span>
              </span>
            </span>
          </label>
          <label class="option">
            <input type="radio" name="style" value="bar">
            <span class="option-body">
              <span class="preview" aria-hidden="true">
                <svg viewBox="0 0 64 40">
                  <text x="32" y="20" text-anchor="middle" class="pv-text pv-text-sm">25:00</text>
                  <rect x="12" y="26" width="40" height="3" rx="1.5" class="pv-track-fill"/>
                  <rect x="12" y="26" width="28" height="3" rx="1.5" class="pv-fill"/>
                </svg>
              </span>
              <span class="option-text">
                <span class="option-title">Bar</span>
                <span class="option-sub">Linear progress</span>
              </span>
            </span>
          </label>
        </div>
      </fieldset>

      <button type="submit" class="btn btn-primary btn-block" id="start-btn">Start focus · 25 min</button>
      <p class="hint">Opens fullscreen · <kbd>Space</kbd> pause · <kbd>Esc</kbd> exit</p>
    </form>
  </main>

  <!-- ============ 2. COUNTDOWN ============ -->
  <section id="timer" class="timer" hidden aria-label="Countdown">
    <div class="stage" id="stage" data-style="digital">
      <p class="phase" id="phase">Focus</p>
      <div class="clock-wrap">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#FF6B6B"/>
              <stop offset=".35" stop-color="#FFE066"/>
              <stop offset=".65" stop-color="#4D96FF"/>
              <stop offset="1" stop-color="#C77DFF"/>
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="100" cy="100" r="92"/>
          <circle class="ring-progress" id="ring-progress" cx="100" cy="100" r="92" pathLength="100"/>
        </svg>
        <div class="clock" id="clock" role="timer" aria-label="25 minutes remaining"></div>
      </div>
      <div class="bar" aria-hidden="true"><div class="bar-fill" id="bar-fill"></div></div>
      <p class="meta" id="meta"></p>
    </div>

    <div class="dock">
      <div class="controls" id="controls">
        <button type="button" class="btn btn-icon" id="restart-btn" aria-label="Restart" title="Restart (R)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button type="button" class="btn btn-primary btn-play" id="pause-btn" aria-label="Pause" title="Pause (Space)">
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" class="filled"/></svg>
        </button>
        <button type="button" class="btn btn-icon" id="fs-btn" aria-label="Enter fullscreen" title="Fullscreen (F)">
          <svg class="icon-expand" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <svg class="icon-shrink" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        </button>
        <button type="button" class="btn btn-icon" id="end-btn" aria-label="End session" title="End (Esc)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="done-actions" id="done-actions" hidden>
        <button type="button" class="btn btn-primary" id="next-btn">Start break · 5 min</button>
        <button type="button" class="btn btn-ghost" id="back-btn">Back to setup</button>
      </div>
      <p class="keys"><kbd>Space</kbd> pause <kbd>R</kbd> restart <kbd>F</kbd> fullscreen <kbd>Esc</kbd> exit</p>
    </div>

    <p class="sr-only" aria-live="polite" id="announcer"></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
